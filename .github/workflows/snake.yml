name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: hafidars
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300E5FF&color_dots=%23161B22,%231E3A8A,%232563EB,%237C3AED,%23C4B5FD
            dist/github-contribution-grid-snake.svg?color_snake=%2300E5FF&color_dots=%23EBEDF0,%239CCFFF,%2360A5FA,%237C3AED,%23C4B5FD

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
